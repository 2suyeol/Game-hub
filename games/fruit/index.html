<!DOCTYPE html>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">

<style>
:root{
  --paper:#F2EEE6; --ink:#1B1E1A; --green:#1F4A38; --green-lit:#2F7A5B;
  --apricot:#E39B6A; --mute:#8C8579; --line:#DCD5C8; --stage:#0F1512;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Pretendard,system-ui,sans-serif;background:var(--paper);color:var(--ink);overscroll-behavior:none}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--green-lit);outline-offset:3px}

#pick{min-height:100dvh;display:grid;place-items:center;padding:32px}
#pick .box{width:min(420px,100%)}
#pick h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
#pick p{color:var(--mute);font-size:14px;line-height:1.6;margin-bottom:28px}
.role{display:block;width:100%;text-align:left;padding:18px 20px;border:1px solid var(--line);
  border-radius:14px;background:#fff;margin-bottom:10px}
.role b{display:block;font-size:16px;font-weight:600;margin-bottom:3px}
.role span{font-size:13px;color:var(--mute)}
.role:hover{border-color:var(--green)}

#pc{position:fixed;inset:0;background:var(--stage);display:block;color:#EDEBE4}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
#panel{position:absolute;top:22px;left:22px;background:rgba(15,21,18,.84);
  border:1px solid rgba(237,235,228,.14);border-radius:16px;padding:18px;width:250px;backdrop-filter:blur(8px)}
#panel h2{font-size:12px;font-weight:600;color:#9FB3A8;margin-bottom:12px}
#code{font-family:'IBM Plex Mono',monospace;font-size:34px;font-weight:600;letter-spacing:.14em;
  color:var(--apricot);line-height:1;margin-bottom:14px}
#qr{background:#fff;padding:9px;border-radius:10px;width:fit-content;margin-bottom:12px}
#qr img,#qr canvas{display:block}
#url{font-size:10px;color:#7F8F86;word-break:break-all;line-height:1.5;margin-bottom:12px}
.stat{display:flex;justify-content:space-between;font-size:12px;padding:4px 0}
.stat span:first-child{color:#7F8F86}
.stat span:last-child{font-family:'IBM Plex Mono',monospace}
#dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#C4553F;margin-right:7px;vertical-align:1px}
#dot.on{background:var(--green-lit)}
#hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:12px;color:#5E6D64}
kbd{font-family:'IBM Plex Mono',monospace;background:rgba(237,235,228,.1);padding:2px 6px;border-radius:5px;font-size:11px}

#remote{display:none;min-height:100dvh;flex-direction:column;touch-action:none;user-select:none;-webkit-user-select:none}
#rjoin{padding:40px 28px;display:flex;flex-direction:column;gap:14px;min-height:100dvh;justify-content:center}
#rjoin h1{font-size:22px;font-weight:700;letter-spacing:-.02em}
#rjoin p{font-size:14px;color:var(--mute);line-height:1.6}
#codein{font-family:'IBM Plex Mono',monospace;font-size:30px;letter-spacing:.2em;text-align:center;
  padding:16px;border:1px solid var(--line);border-radius:12px;background:#fff;text-transform:uppercase;width:100%}
.cta{background:var(--green);color:#F4F1E9;padding:17px;border-radius:12px;font-size:16px;font-weight:600;
  text-align:center;width:100%}
.cta:active{background:var(--green-lit)}
.ghost{background:transparent;border:1px solid var(--line);color:var(--mute);padding:15px;border-radius:12px;
  font-size:15px;text-align:center;width:100%}
#rerr{font-size:13px;color:#B4472F;min-height:18px}

#rpad{display:none;flex:1;flex-direction:column;padding:14px;gap:12px}
#rtop{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute)}
#aim{flex:1;border:1px solid var(--line);border-radius:18px;background:#fff;display:grid;place-items:center;
  text-align:center;padding:20px}
#aimTitle{font-size:17px;font-weight:600;margin-bottom:8px}
#aimSub{font-size:13px;color:var(--mute);line-height:1.6}
#btnCal{background:var(--apricot);color:#2A1A10;padding:18px;border-radius:14px;font-size:16px;font-weight:600;width:100%}
#btnCal:active{filter:brightness(.94)}
.abrow{display:flex;gap:12px}
.ab{flex:1;aspect-ratio:2.1;border-radius:16px;display:grid;place-items:center;
  font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600}
.ab small{display:block;font-family:Pretendard,sans-serif;font-size:11px;font-weight:500;opacity:.72;margin-top:2px}
#btnA{background:var(--green);color:#F4F1E9}
#btnB{background:#fff;border:1px solid var(--line)}
.ab:active{transform:scale(.97)}

#rentry{display:none;flex:1;flex-direction:column;padding:26px 22px;gap:12px;justify-content:center}
#rentry h2{font-size:20px;font-weight:700;letter-spacing:-.02em}
#rentry .score{font-family:'IBM Plex Mono',monospace;font-size:44px;font-weight:600;color:var(--green);line-height:1.1}
#rentry .cap{font-size:13px;color:var(--mute);line-height:1.6;margin-bottom:6px}
#rentry input{padding:16px;border:1px solid var(--line);border-radius:12px;font:inherit;font-size:17px;background:#fff;width:100%}
#rentry input:focus{outline:2px solid var(--green-lit);outline-offset:-1px}
#rdone{display:none;flex:1;flex-direction:column;padding:26px 22px;gap:14px;justify-content:center;text-align:center}
#rdone h2{font-size:20px;font-weight:700}
#rdone p{font-size:14px;color:var(--mute);line-height:1.6}
</style>
</head>
<body>

<section id="pc">
  <canvas id="stage"></canvas>
  <div id="hint"><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 감도 · <kbd>T</kbd> 조작 연습 · <kbd>C</kbd> 조준 초기화 · <kbd>R</kbd> 기록 관리 · <kbd>E</kbd> 내보내기</div>
</section>

<script>
const P = new URLSearchParams(location.search);
const $ = s => document.querySelector(s);
const rand = (a,b)=>a+Math.random()*(b-a);
const clamp = (v,a,b)=>v<a?a:v>b?b:v;

/* ---------- 기록 ---------- */
const K_REC = 'smcln-fruit-records';
function records(){ try{ const v=JSON.parse(localStorage.getItem(K_REC)); return v||[]; }catch(e){ return []; } }
function saveRecords(v){ try{ localStorage.setItem(K_REC, JSON.stringify(v)); }catch(e){} }
const topRecords = n => records().slice().sort((a,b)=>b.score-a.score).slice(0,n);
const keyOf = r => (r.sid||'') + '|' + (r.name||'');
// 한 사람이 여러 판을 해도 순위표에는 최고 기록만 올린다
function leaderboard(n){
  const best = new Map();
  for (const r of records()){
    const k = keyOf(r), cur = best.get(k);
    if (!cur || r.score > cur.score) best.set(k, r);
  }
  const list = [...best.values()].sort((a,b)=>b.score-a.score);
  return n ? list.slice(0,n) : list;
}

startPC();

/* =====================================================================
   게임 화면
   ===================================================================== */
function startPC(){
  const cv = $('#stage'), ctx = cv.getContext('2d');
  let W=0,H=0;
  function resize(){
    const d = Math.min(devicePixelRatio||1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W*d; cv.height = H*d; ctx.setTransform(d,0,0,d,0,0);
  }
  addEventListener('resize', resize); resize();

  /* ---------- 조준 ---------- */
  let ref=null, raw={x:W/2,y:H/2}, cur={x:W/2,y:H/2}, prev={x:W/2,y:H/2}, vel=0;
  let DEG_X = 40, DEG_Y = 26;
  let rawT = performance.now(), rawV = {x:0,y:0}, rtt = 0;
  function applyOrientation(o){
    if(!ref) return;
    const dA = ((o.a - ref.a + 540) % 360) - 180;
    const dB = o.b - ref.b;
    const nx = clamp(W/2 - dA*(W/DEG_X), 0, W);
    const ny = clamp(H/2 - dB*(H/DEG_Y), 0, H);
    const now = performance.now(), gap = Math.max((now-rawT)/1000, 0.004);
    rawV.x = (nx-raw.x)/gap; rawV.y = (ny-raw.y)/gap;
    raw.x = nx; raw.y = ny; rawT = now;
  }

  /* ---------- 상태 ---------- */
  let scene = 'home';       // home | tutorial | ready | play | entry | result
  let game = null, last = performance.now();
  let shake = 0, flash = 0;
  let lastScore = 0, lastLevel = 1, lastRank = 0;
  let endReason = 'time';                 // time | bomb | quit
  let paused = false, resumeT = 0, quitT = 0;
  let manage = false;                     // 기록 관리 화면
  const REASON = {time:'시간 종료', bomb:'폭탄을 잘랐습니다', quit:'중단했습니다'};
  let entry = {sid:'', name:'', field:0};
  const trail = [];

  /* ---------- 소리 ---------- */
  let AC = null;
  function blip(freq, dur, type, gain){
    try{
      if (!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
      if (AC.state === 'suspended'){ AC.resume(); return; }
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type||'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(gain||.2, AC.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+dur);
      o.connect(g); g.connect(AC.destination);
      o.start(); o.stop(AC.currentTime+dur);
    }catch(e){}
  }
  addEventListener('pointerdown', ()=>{ if (AC && AC.state==='suspended') AC.resume(); });

  /* ---------- 그리기 유틸 ---------- */
  function txt(s,x,y,size,color,weight,align){
    ctx.fillStyle=color; ctx.textAlign=align||'center'; ctx.textBaseline='alphabetic';
    ctx.font=(weight||600)+' '+size+'px Pretendard, sans-serif'; ctx.fillText(s,x,y);
  }
  function mono(s,x,y,size,color,align){
    ctx.fillStyle=color; ctx.textAlign=align||'center';
    ctx.font='600 '+size+'px "IBM Plex Mono", monospace'; ctx.fillText(s,x,y);
  }
  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }
  function segDist(px,py,x1,y1,x2,y2){
    const dx=x2-x1, dy=y2-y1, L=dx*dx+dy*dy;
    let t = L ? ((px-x1)*dx+(py-y1)*dy)/L : 0;
    t = clamp(t,0,1);
    return Math.hypot(px-(x1+t*dx), py-(y1+t*dy));
  }

  /* =====================================================================
     과일 자르기
     ===================================================================== */
  const START_TIME = 45;      // 시작 제한 시간
  const LETHAL_LV  = 3;       // 이 단계부터 폭탄을 자르면 즉시 종료
  const SLICE_VEL  = 420;     // 자르기로 인정되는 커서 속도

  // 다음 단계까지 필요한 누적 점수
  const TH = [0, 300, 750, 1350, 2100, 3000, 4050, 5250];
  function needFor(lv){
    return lv < TH.length ? TH[lv] : TH[TH.length-1] + (lv - TH.length + 1)*1500;
  }
  // 단계를 올릴 때 더해주는 시간
  const timeBonus = lv => Math.max(8, 22 - (lv-2)*2);

  const FR = [
    {c:'#D9455F', in:'#F4C3CB', r:44},
    {c:'#C0432E', in:'#F0D8C6', r:34},
    {c:'#E39B6A', in:'#F7DDBE', r:34},
    {c:'#7FA84A', in:'#DDEAC0', r:30},
    {c:'#7A5AA8', in:'#DCCDEF', r:28},
    {c:'#E0C04A', in:'#F6EAB6', r:30},
  ];

  function makeGame(){
    return {
      time: START_TIME, maxTime: START_TIME, barFlash: 0,
      score:0, level:1, combo:0, comboT:0,
      items:[], bits:[], spark:[], spawnT:0.6,
      banner:'', bannerSub:'', bannerT:0, gained:0,
      rushOn:false, floats:[],

      // 단계가 오를수록 1에 천천히 접근하는 난이도 계수 — 상한이 없다
      dp(){ return 1 - Math.pow(0.85, this.level-1); },

      update(dt){
        this.time -= dt; this.bannerT -= dt; this.barFlash -= dt;
        for (const fl of this.floats){ fl.y -= 46*dt; fl.life -= dt; if (fl.life<=0) fl.dead = true; }
        this.floats = this.floats.filter(f=>!f.dead);
        if (this.time<=0){ this.time=0; endGame('time'); return; }
        this.comboT -= dt; if (this.comboT<=0) this.combo=0;

        // 단계는 오직 점수로만 오른다
        while (this.score >= needFor(this.level)){
          this.level++;
          const bonus = timeBonus(this.level);
          this.time += bonus;
          this.maxTime = this.time;      // 막대를 늘어난 시간 기준으로 다시 잡는다
          this.barFlash = 1.2;
          this.gained += bonus;
          this.banner = this.level + '단계';
          this.bannerSub = '시간 +' + bonus + '초'
            + (this.level===LETHAL_LV ? '   ·   지금부터 폭탄을 자르면 끝납니다' : '');
          this.bannerT = 2.4;
          blip(this.level>=LETHAL_LV ? 300 : 660, .18, 'triangle', .22);
        }

        const p = this.dp();

        // 남은 시간 10초부터는 피버타임 — 과일이 쏟아지고 폭탄은 줄어든다
        const rush = this.time <= 10;
        if (rush && !this.rushOn){
          this.rushOn = true;
          this.banner = '피버타임'; this.bannerSub = '과일이 쏟아집니다'; this.bannerT = 1.6;
          blip(520, .12, 'square', .18);
        } else if (!rush && this.rushOn) this.rushOn = false;

        this.spawnT -= dt;
        if (this.spawnT<=0){
          this.spawnT = Math.max(0.10, rand(0.6,1.0)*(1 - 0.62*p)*(rush ? 0.45 : 1));
          let n = 1;
          if (Math.random() < 0.15 + p*0.55) n++;
          if (this.level >= 5 && Math.random() < p*0.5) n++;
          if (rush) n++;
          for(let i=0;i<n;i++) this.spawn(p, rush);
        }

        const G    = 720 + 380*p;          // 중력 — 셀수록 화면에 머무는 시간이 짧다
        const pad  = 26 - 14*p;            // 자르기 판정 반경
        const need = SLICE_VEL + 110*p;    // 인정되는 최소 스윙 속도
        for (const f of this.items){
          f.vy += G*dt; f.x += f.vx*dt; f.y += f.vy*dt; f.rot += f.spin*dt;
          if (f.y > H+100) f.dead = true;
          if (f.cut) continue;
          if (vel > need && segDist(f.x,f.y, prev.x,prev.y, cur.x,cur.y) < f.r+pad) this.cut(f);
        }
        this.items = this.items.filter(f=>!f.dead);

        for (const b of this.bits){
          b.vy += 900*dt; b.x += b.vx*dt; b.y += b.vy*dt; b.rot += b.spin*dt; b.life -= dt;
          if (b.life<=0 || b.y>H+100) b.dead=true;
        }
        this.bits = this.bits.filter(b=>!b.dead);
        for (const s of this.spark){
          s.vy += 500*dt; s.x += s.vx*dt; s.y += s.vy*dt; s.life -= dt;
          if (s.life<=0) s.dead=true;
        }
        this.spark = this.spark.filter(s=>!s.dead);
      },

      spawn(p, rush){
        const bomb = Math.random() < (0.06 + p*0.17) * (rush ? 0.35 : 1);
        const kind = bomb ? {c:'#22262A', in:'#3A4148', r:30} : FR[Math.floor(Math.random()*FR.length)];
        // 선을 따라 정확히 잘라야 하는 과일
        const guided = !bomb && Math.random() < 0.10 + p*0.10;
        const x = rand(W*0.12, W*0.88);
        this.items.push({
          x, y:H+60,
          r: kind.r*(1 - 0.28*p) * (guided ? 1.2 : 1),
          c:kind.c, inc:kind.in, bomb, guided,
          line: guided ? rand(0, Math.PI) : 0,
          vx:(W/2-x)*rand(0.25,0.55)*(1+0.6*p)*(guided ? 0.6 : 1),
          vy: guided ? -rand(780,880) : -rand(660,780)-p*240,
          rot:0, spin: guided ? rand(-0.5,0.5) : rand(-3,3)*(1+p),
          cut:false, dead:false
        });
      },

      cut(f){
        f.cut = true; f.dead = true;
        const ang = Math.atan2(cur.y-prev.y, cur.x-prev.x);
        for(let s=-1;s<=1;s+=2){
          this.bits.push({x:f.x, y:f.y, r:f.r, c:f.c, inc:f.inc, ang,
            vx:Math.cos(ang+s*1.6)*220+f.vx*0.4, vy:Math.sin(ang+s*1.6)*220+f.vy*0.4,
            rot:f.rot, spin:s*4, life:1.8, dead:false});
        }
        for(let i=0;i<16;i++){
          this.spark.push({x:f.x, y:f.y, c:f.bomb?'#8A939B':f.inc,
            vx:rand(-260,260), vy:rand(-320,120), r:rand(2,6), life:rand(.4,.9), dead:false});
        }
        if (f.bomb){
          this.combo = 0; shake = 20; flash = .5;
          blip(90, .35, 'sawtooth', .25);
          if (this.level >= LETHAL_LV){ this.banner='폭탄'; this.bannerSub=''; this.bannerT=1.4; endGame('bomb'); }
          else { this.score = Math.max(0, this.score - 10); this.float(f.x, f.y, '-10', '#F04A32', 22); }
        } else {
          this.combo++; this.comboT = 0.55;
          const mult = Math.min(this.combo, 6);
          const base = 10 * mult;
          if (f.guided){
            // 스윙 각도와 표시선의 차이 — 선은 방향이 없으므로 90도 안으로 접는다
            const norm = a => ((a % Math.PI) + Math.PI) % Math.PI;
            let d = Math.abs(norm(ang) - norm(f.line + f.rot));
            if (d > Math.PI/2) d = Math.PI - d;
            if (d < 0.42){
              const gain = base*3 + 50;
              this.score += gain;
              this.float(f.x, f.y, '정확  +' + gain, '#FFD34A', 30, 1.3);
              blip(980, .12, 'triangle', .22);
            } else {
              this.score += base;
              this.float(f.x, f.y, '+' + base + '  각도 빗나감', 'rgba(237,235,228,.75)', 18);
            }
          } else {
            this.score += base;
            this.float(f.x, f.y, '+' + base, mult>=4 ? '#E39B6A' : '#EDEBE4', 18 + mult*2);
          }
        }
      },
      float(x, y, text, color, size, life){
        const l = life || 0.9;
        this.floats.push({x, y, text, color:color||'#EDEBE4', size:size||20, life:l, max:l, dead:false});
      },

      draw(){
        const g = ctx.createLinearGradient(0,0,0,H);
        g.addColorStop(0,'#5C4835'); g.addColorStop(1,'#3B2E22');
        ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
        ctx.strokeStyle='rgba(255,255,255,.03)'; ctx.lineWidth=2;
        for(let y=30;y<H;y+=46){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

        for (const s of this.spark){
          ctx.globalAlpha = clamp(s.life,0,1);
          ctx.fillStyle=s.c; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,7); ctx.fill();
        }
        ctx.globalAlpha=1;
        for (const b of this.bits) drawHalf(b);
        for (const f of this.items) drawWhole(f);

        // 남은 시간 막대 — 단계마다 늘어난 시간을 기준으로 다시 채워진다
        const barW = clamp(this.time/this.maxTime, 0, 1);
        ctx.fillStyle='rgba(0,0,0,.28)'; ctx.fillRect(0,0,W,7);
        ctx.fillStyle = this.barFlash>0 ? '#2F7A5B' : (this.time<10 ? '#F04A32' : '#E39B6A');
        ctx.fillRect(0,0,W*barW,7);
        if (this.barFlash>0){
          ctx.globalAlpha = clamp(this.barFlash,0,1)*0.55;
          ctx.fillStyle='#EDEBE4'; ctx.fillRect(0,0,W*barW,7);
          ctx.globalAlpha = 1;
        }
        mono(Math.ceil(this.maxTime)+'초 중', 10, 24, 11, 'rgba(237,235,228,.3)', 'left');

        for (const fl of this.floats){
          ctx.globalAlpha = clamp(fl.life/fl.max*1.5, 0, 1);
          txt(fl.text, fl.x, fl.y, fl.size, fl.color, 700);
        }
        ctx.globalAlpha = 1;

        hud(this);
        if (this.rushOn){

  function drawWhole(f){
    ctx.save(); ctx.translate(f.x,f.y); ctx.rotate(f.rot);
    if (f.bomb){
      const t = performance.now();
      ctx.strokeStyle='rgba(240,74,50,.32)'; ctx.lineWidth=7;
      ctx.beginPath(); ctx.arc(0,0,(f.r+13)*(1+Math.sin(t/90)*0.09),0,7); ctx.stroke();
      ctx.fillStyle='#15181B';
      ctx.beginPath(); ctx.arc(0,0,f.r,0,7); ctx.fill();
      ctx.strokeStyle='#F04A32'; ctx.lineWidth=4;
      ctx.beginPath(); ctx.arc(0,0,f.r,0,7); ctx.stroke();
      ctx.strokeStyle='#EDEBE4'; ctx.lineWidth=5; ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(-f.r*0.4,-f.r*0.4); ctx.lineTo(f.r*0.4,f.r*0.4);
      ctx.moveTo(f.r*0.4,-f.r*0.4);  ctx.lineTo(-f.r*0.4,f.r*0.4);
      ctx.stroke();
      ctx.strokeStyle='#C9CFD4'; ctx.lineWidth=5;
      ctx.beginPath(); ctx.moveTo(0,-f.r); ctx.quadraticCurveTo(16,-f.r-18,5,-f.r-30); ctx.stroke();
      ctx.fillStyle='#FFD34A';
      ctx.beginPath(); ctx.arc(5,-f.r-32, 6+Math.sin(t/60)*2, 0, 7); ctx.fill();
    } else {
      ctx.fillStyle=f.c; ctx.beginPath(); ctx.arc(0,0,f.r,0,7); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.22)';
      ctx.beginPath(); ctx.ellipse(-f.r*0.32,-f.r*0.36,f.r*0.3,f.r*0.2,-0.6,0,7); ctx.fill();
      if (f.guided){
        ctx.strokeStyle='#FFD34A'; ctx.lineWidth=3;
        ctx.beginPath(); ctx.arc(0,0,f.r+7,0,7); ctx.stroke();
        ctx.save(); ctx.rotate(f.line);
        const L = f.r + 20;
        ctx.setLineDash([9,7]); ctx.lineWidth=4; ctx.strokeStyle='#FFF6DA'; ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(-L,0); ctx.lineTo(L,0); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle='#FFD34A';
        [-1,1].forEach(s=>{ ctx.beginPath(); ctx.arc(s*L,0,4.5,0,7); ctx.fill(); });
        ctx.restore();
      }
    }
    ctx.restore();
  }

  function tutUpdate(dt){
    tut.t += dt;
    if (tut.step===0 && ref){ tut.step = 1; tut.t = 0; }
    if (tut.step===1){
      let all = true;
      for (const m of tut.marks){
        if (!m.cut && vel > SLICE_VEL && segDist(m.x, m.y, prev.x, prev.y, cur.x, cur.y) < 52){
          m.cut = true; blip(760, .09, 'triangle', .2);
        }
        if (!m.cut) all = false;
      }
      if (all){ tut.step = 2; tut.t = 0; }
    }
    if (tut.step===2 && tut.t > 1.6){ tut = null; scene = 'home'; sendPad('home'); }

  /* ---------- 이름 입력 · 결과 ---------- */
  function endGame(reason){
    endReason = reason || 'time';
    lastScore = Math.max(0, Math.round(game.score));
    lastLevel = game.level;
    entry = {sid:'', name:'', field:0};
    paused = false; resumeT = 0; quitT = 0;
    scene = 'entry';
    sendPad('entry', {score:lastScore, level:lastLevel, reason:REASON[endReason]});
  }
  function commitEntry(sid, name){
    const s = (sid||'').trim(), n = (name||'').trim();
    if (!s && !n) return false;
    const rec = records();
    const mine = {sid:s, name:n, score:lastScore, level:lastLevel, ts:Date.now()};
    rec.push(mine);
    saveRecords(rec);
    Hub.submitScore({ sid: s, name: n, score: lastScore, level: lastLevel });
    const lb = leaderboard(0);
    const i = lb.findIndex(r => keyOf(r)===keyOf(mine));
    lastRank = i >= 0 ? i+1 : lb.filter(r=>r.score>lastScore).length+1;
    scene = 'result'; sendPad('result');
    blip(820, .14, 'triangle', .2);
    return true;
  }
  function skipEntry(){
    lastRank = leaderboard(0).filter(r=>r.score > lastScore).length + 1;
    scene = 'result'; sendPad('result');
  }

    ctx.fillStyle='rgba(15,21,18,.92)'; ctx.fillRect(0,0,W,H);

  /* ---------- 기록 관리 ---------- */
  function recentRecords(){

  /* ---------- 입력 ---------- */
  function pressA(){
    if (manage) return;
    if (scene==='tutorial') return;
    else if (scene==='home') startGame();
    else if (scene==='ready') ready = 0;
    else if (scene==='play'){ quitT = 0; }      // 실수로 B를 눌렀을 때 취소
    else if (scene==='entry') commitEntry(entry.sid, entry.name);
    else if (scene==='result') startGame();
  }
  function pressB(){
    if (manage){ manage = false; return; }
    if (scene==='tutorial'){ tut=null; scene='home'; sendPad('home'); }
    else if (scene==='ready'){ scene='home'; sendPad('home'); }
    else if (scene==='play'){
      if (quitT > 0) endGame('quit');           // 2.5초 안에 한 번 더 누르면 종료
      else { quitT = 2.5; blip(240, .1, 'sine', .18); }
    }
    else if (scene==='entry') skipEntry();
    else if (scene==='result'){ scene='home'; sendPad('home'); }
    else ref = null;
  }
  function startGame(){ game = makeGame(); ready = 3.2; scene='ready'; sendPad('ready'); }

  /* ---------- 커서 ---------- */
  let lastA = 0;
  function drawCursor(){
    const held = performance.now()-lastA < 110;
    ctx.strokeStyle = held ? '#2F7A5B' : '#E39B6A';
    ctx.lineWidth = held ? 4 : 2.5;
    ctx.beginPath(); ctx.arc(cur.x,cur.y, held?13:17, 0, 7); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cur.x-25,cur.y); ctx.lineTo(cur.x-7,cur.y);
    ctx.moveTo(cur.x+7,cur.y);  ctx.lineTo(cur.x+25,cur.y);
    ctx.moveTo(cur.x,cur.y-25); ctx.lineTo(cur.x,cur.y-7);
    ctx.moveTo(cur.x,cur.y+7);  ctx.lineTo(cur.x,cur.y+25);
    ctx.stroke();
  }
  function drawTrail(now){
    while (trail.length && now-trail[0].t > 200) trail.shift();
    ctx.lineCap='round';
    for(let i=1;i<trail.length;i++){
      const a = i/trail.length;
      ctx.strokeStyle='rgba(242,238,230,'+(a*0.7).toFixed(3)+')';
      ctx.lineWidth = 2 + a*7;
      ctx.beginPath(); ctx.moveTo(trail[i-1].x,trail[i-1].y); ctx.lineTo(trail[i].x,trail[i].y); ctx.stroke();
    }
  }

  /* ---------- 루프 ---------- */
  function loop(now){
    const dt = Math.min((now-last)/1000, 0.05); last = now;
    prev.x = cur.x; prev.y = cur.y;
    const lead = clamp(rtt/2, 0, 110)/1000 + clamp((now-rawT)/1000, 0, 0.05);
    const tx = clamp(raw.x + rawV.x*lead, 0, W);
    const ty = clamp(raw.y + rawV.y*lead, 0, H);
    const k = 1 - Math.exp(-dt/0.030);
    cur.x += (tx-cur.x)*k; cur.y += (ty-cur.y)*k;
    vel = Math.hypot(cur.x-prev.x, cur.y-prev.y)/Math.max(dt,0.001);
    trail.push({x:cur.x, y:cur.y, t:now});

    ctx.save();
    if (shake>0){ ctx.translate(rand(-shake,shake), rand(-shake,shake)); shake*=0.86; if(shake<0.4)shake=0; }

    if (scene==='tutorial') tutUpdate(dt);
    else if (scene==='ready'){ ready -= dt; if (ready<=0){ scene='play'; sendPad('play'); } }
    else if (scene==='play'){
      if (quitT > 0) quitT -= dt;
      if (resumeT > 0){ resumeT -= dt; if (resumeT<=0) sendPad('play'); }
      else if (!paused) game.update(dt);
    }

    if (scene==='home') drawHome();
    else if (scene==='tutorial') drawTutorial();
    else if (scene==='ready') drawReady();
    else if (scene==='play') game.draw();
    else if (scene==='entry'){ game.draw(); drawEntry(); }
    else { game.draw(); drawResult(); }

    if (scene==='play' || scene==='tutorial') drawTrail(now);
    if (scene!=='entry' && scene!=='result' && !manage) drawCursor();

    if (scene==='play' && quitT>0){
      ctx.fillStyle='rgba(15,21,18,.75)';
      roundRect(W/2-230, H*0.40, 460, 96, 16); ctx.fill();
      txt('그만두시겠어요?', W/2, H*0.40+42, 24, '#EDEBE4', 700);
      txt('B를 한 번 더 누르면 종료 · A를 누르면 계속', W/2, H*0.40+72, 15, 'rgba(237,235,228,.55)', 500);
    }
    if (scene==='play' && (paused || resumeT>0)){
      ctx.fillStyle='rgba(15,21,18,.88)'; ctx.fillRect(0,0,W,H);
      if (paused){
        txt('컨트롤러 연결이 끊겼습니다', W/2, H*0.45, 32, '#EDEBE4', 700);
        txt('폰에서 자동으로 다시 연결하는 중입니다. 게임은 멈춰 있습니다.', W/2, H*0.45+38, 17, 'rgba(237,235,228,.55)', 500);
      } else {
        txt('다시 시작합니다', W/2, H*0.42, 28, '#EDEBE4', 700);
        mono(String(Math.ceil(resumeT)), W/2, H*0.42+90, 68, '#E39B6A');
      }
    }
    if (manage) drawManage();
    ctx.restore();

    if (flash>0){ ctx.fillStyle='rgba(255,120,90,'+flash.toFixed(3)+')'; ctx.fillRect(0,0,W,H); flash*=0.85; if(flash<0.01)flash=0; }
    if (!ref && scene==='play')
      txt('조준이 맞춰지지 않았습니다 — 폰에서 조준 맞추기', W/2, H-28, 14, 'rgba(237,235,228,.35)', 500);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /* ---------- 마우스·키보드 ---------- */
  cv.addEventListener('mousemove', e => { if(!ref) ref={a:0,b:0}; raw.x=e.clientX; raw.y=e.clientY; });
  cv.addEventListener('mousedown', e => { e.preventDefault();
    if(e.button===0){ lastA=performance.now(); pressA(); } else pressB(); });
  cv.addEventListener('contextmenu', e => e.preventDefault());

  addEventListener('keydown', e => {
    if (scene==='entry'){                       // 컴퓨터 키보드로도 입력 가능
      const f = () => entry.field===0 ? 'sid' : 'name';
      if (e.key==='Tab'){ e.preventDefault(); entry.field = 1-entry.field; return; }
      if (e.key==='Enter'){ if (!commitEntry(entry.sid, entry.name)) entry.field=0; return; }
      if (e.key==='Escape'){ skipEntry(); return; }
      if (e.key==='Backspace'){ entry[f()] = entry[f()].slice(0,-1); return; }
      if (e.key.length===1 && entry[f()].length < 12) entry[f()] += e.key;
      return;
    }
    if (manage){
      if (e.key>='0' && e.key<='9'){ deleteAt((parseInt(e.key,10)+9)%10); return; }
      if (e.key==='r'||e.key==='R'||e.key==='Escape'){ manage=false; return; }
      if (e.key==='e'||e.key==='E'){ exportCSV(); return; }
      if (e.key==='x'||e.key==='X'){
        if (confirm('모든 기록을 지웁니다. 되돌릴 수 없습니다.') &&
            confirm('정말 지울까요? 먼저 E로 내보내는 것을 권합니다.')) saveRecords([]);
        return;
      }
      return;
    }
    if (e.key==='r'||e.key==='R'){ if (scene!=='play') manage = true; return; }
    if (e.key==='1'){ DEG_X=28; DEG_Y=18; }
    if (e.key==='2'){ DEG_X=40; DEG_Y=26; }
    if (e.key==='3'){ DEG_X=55; DEG_Y=36; }
    if (e.key==='c'||e.key==='C') ref=null;
    if (e.key==='t'||e.key==='T') startTutorial();
    if (e.key==='e'||e.key==='E') exportCSV();
  });

  function exportCSV(){
    const rec = records().slice().sort((a,b)=>b.score-a.score);
    if (!rec.length){ alert('내보낼 기록이 없습니다.'); return; }
    const rows = [['순위','이름','학번','점수','단계','시각']].concat(
      rec.map((r,i)=>[i+1, r.name||'', r.sid||'', r.score, r.level, new Date(r.ts).toLocaleString('ko-KR')]));
    const csv = '\uFEFF' + rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
    a.download = 'fruit-' + new Date().toISOString().slice(0,10) + '.csv';
    a.click();
  }

  /* ---------- 게임 센터 연결 ----------
     폰 연결은 게임 센터가 맡고, 이 게임은 입력만 받는다.
     조준 계산(applyOrientation, 조준 맞추기, 지연 보정)은 원래 코드를 그대로 쓴다. */
  const PADS = {
    home:     ['과일 자르기', 'A를 누르면 한 판이 시작됩니다.'],
    tutorial: ['조작 연습', '화면 안내를 따라 해보세요. B를 누르면 건너뜁니다.'],
    ready:    ['곧 시작합니다', '화면의 설명을 읽어보세요. A를 누르면 바로 시작합니다.'],
    play:     ['과일 자르기', '폰을 빠르게 휘둘러 자르세요. 폭탄은 건드리지 마세요.'],
    result:   ['결과', 'A를 누르면 한 판 더, B를 누르면 처음으로 돌아갑니다.'],
  };
  function sendPad(mode, extra){
    if (mode === 'entry'){
      Hub.setPad('form', {
        title: '기록을 남기시겠어요?',
        big: String(extra.score),
        hint: (extra.reason ? extra.reason + '. ' : '') + extra.level + '단계까지 도달했습니다. 순위표에 남기려면 입력해주세요.',
        fields: [
          { id: 'sid',  label: '학번', inputmode: 'numeric', maxlength: 10 },
          { id: 'name', label: '이름', maxlength: 12 }
        ],
        submit: '순위표에 올리기',
        skip: '기록 없이 넘어가기'
      });
      return;
    }
    const p = PADS[mode] || PADS.play;
    Hub.setPad('motion', { title: p[0], hint: p[1] });
  }

  Hub.on('motion', o => { if (o.rtt) rtt = o.rtt; applyOrientation(o); });
  Hub.on('calibrate', d => { ref = { a: d.a, b: d.b }; });
  // 게임 센터 밖에서 열었을 때는 원래 마우스 조작을 쓰므로 SDK 버튼은 게임 센터 안에서만 받음
  if (Hub.inHub) Hub.on('button', b => {
    if (!b.down) return;
    if (b.key === 'A'){ lastA = performance.now(); pressA(); }
    else if (b.key === 'B') pressB();
  });
  Hub.on('form', d => { if (scene === 'entry') commitEntry(d.values.sid, d.values.name); });
  Hub.on('formSkip', () => { if (scene === 'entry') skipEntry(); });
  Hub.on('controller', d => {
    if (!d.connected){ if (scene === 'play') paused = true; }
    else if (scene === 'play' && paused){ paused = false; resumeT = 3; }
  });
  // 게임을 켤 때 폰이 연결돼 있으면 조작 연습부터 (원래도 폰이 붙으면 연습부터 시작)
  Hub.on('hello', d => { if (d.connected) startTutorial(); else sendPad('home'); });
  Hub.on('exit', () => { try{ if (AC) AC.close(); }catch(e){} });
  Hub.ready();
}

</script>
</body>
</html>
