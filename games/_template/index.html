<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>새 게임</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#172033;color:#F5F1E6;font-family:sans-serif}
  canvas{display:block;width:100%;height:100%}
</style>
<!-- 1. 공용 스크립트 불러오기 (폴더 위치가 games/게임이름/ 이면 이 경로 그대로) -->
<script src="../../hub-sdk.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0;
// 2. 화면 크기는 창에 맞춰 늘어나게
function resize(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
addEventListener('resize', resize); resize();

let x = .5, y = .5, color = '#FFC857';

// 3. 입력 받기 — 폰이든 개발 모드의 마우스든 똑같이 들어옴
Hub.on('pointer', p => { x = p.x; y = p.y; });
Hub.on('button', b => {
  if (b.key === 'A' && b.down) color = color === '#FFC857' ? '#6FD6C1' : '#FFC857';
});

// 4. 나갈 때 소리 끄기, 타이머 정리 등 (카메라는 SDK가 알아서 끔)
Hub.on('exit', () => {});

function loop(){
  ctx.fillStyle = '#172033'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x*W, y*H, 30, 0, Math.PI*2); ctx.fill();
  requestAnimationFrame(loop);
}
loop();

// 5. 준비가 끝났다고 알리기 (이걸 불러야 로딩 화면이 걷힘)
Hub.ready();

// 점수를 남기려면: Hub.submitScore({ name: '홍길동', score: 1200 });
// 게임이 끝나고 스스로 홈으로 가려면: Hub.exit();
</script>
</body>
</html>
